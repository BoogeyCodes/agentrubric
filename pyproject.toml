[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrubric"
version = "0.1.0"
description = "Score, rank and report on AI coding-agent runs against a quality rubric."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdul Raheem" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "evaluation", "rubric", "llm", "scoring", "ranking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agentrubric = "agentrubric.cli:main"

[project.urls]
Homepage = "https://github.com/BoogeyCodes/agentrubric"
Issues = "https://github.com/BoogeyCodes/agentrubric/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
